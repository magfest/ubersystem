{# Small JS helpers shared by the hotel-section pages that build DOM
   from AJAX responses. Include INSIDE an existing <script> block:

       <script>
       {% include 'hotel_lottery_admin/_shared_js.html' %}
       ...page code...
       </script>
#}
function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}
