{% extends "guestbase.html" %}

{% block body %}
  <h3>Booth Preferences</h3>
  Please fill out a Google form to help our team plan your game's booth location. Once you have completed the form, let us know that you've done so below.</p>

  <form class="form form-horizontal" method="post" action="mivs_logistics">
  <input type="hidden" name="guest_id" value="{{ guest.id }}"/>
    <div class="form-group">
        <div class="col-sm-9 col-sm-offset-3">
            <h4><a href="https://forms.gle/YjzrFmnGGyaaNsfw7" target="_blank">Booth Preferences Form</a></h4>
        </div>
    </div>
    <div class="form-group">
      <div class="col-sm-9 col-sm-offset-3">
        <label for="confirm_checkbox">
          <input type="checkbox" name="confirm_checkbox" id="confirm_checkbox" value="1"{% if confirm_checkbox %} checked{% endif %}>
          I have filled out the booth preferences form linked above.
        </label>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-6 col-sm-offset-3">
        <button type="submit" class="btn btn-primary">Confirm Booth Preferences</button>
      </div>
    </div>
  </form>
{% endblock body %}
